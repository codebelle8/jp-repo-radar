name: Watch auto-fix pull requests

# Every 15 minutes: asks the deployed app to refresh running auto-fix sessions and check open pull requests
# for reviews, comments, CI results and merges (the app then shows in-app notifications).
# Needs the repository variable APP_URL (e.g. https://jp-repo-radar.vercel.app) and the secret CRON_SECRET
# (the same value as in Vercel). Without them the job does nothing.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the watch endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -m 120 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/watch"
